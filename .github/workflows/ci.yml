name: AI Inventory Agent CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build --label "org.opencontainers.image.source=https://github.com/gitkhal/InvActions-430" -t ghcr.io/gitkhal/invactions-430:latest .

      - name: Publish Docker image
        run: docker push ghcr.io/gitkhal/invactions-430:latest

  deploy:
    needs: test
    runs-on: [self-hosted, inventory-deploy]
    permissions:
      packages: read
    steps:
      - name: Verify Docker Desktop is available
        shell: powershell
        run: |
          docker info --format "Docker server: {{.ServerVersion}} | Container OS: {{.OSType}}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and deploy latest image
        shell: powershell
        run: |
          $image = "ghcr.io/gitkhal/invactions-430:latest"
          docker pull --platform linux/amd64 $image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $existing = docker ps -aq --filter "name=^/inventory-agent$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($existing) {
            docker rm -f inventory-agent
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          docker run -d --platform linux/amd64 --name inventory-agent -p 127.0.0.1:8000:8000 --env-file C:\actions-runner\inventory.env $image
          exit $LASTEXITCODE
